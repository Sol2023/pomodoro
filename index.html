<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>番茄工位 · 专注计时与每日记录</title>
<meta name="description" content="按学习科目和项目记录每天的专注时间。">
<style>
:root{color-scheme:light;--paper:#f6f2ea;--white:#fffdf8;--ink:#282720;--muted:#635f55;--line:#e5ded0;--red:#ab3d2d;--soft:#fae9df;--green:#476548}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #548655;outline-offset:3px}
header{border-bottom:1px solid var(--line)}.top,main{width:min(1080px,calc(100% - 40px));margin:auto}.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:19px;font-weight:780}.dot{color:var(--red);margin-right:8px}.local{font-size:12px;color:var(--green);background:#e8eee2;border-radius:99px;padding:5px 12px}
main{padding:42px 0 24px}.eyebrow{color:var(--red);font-size:11px;letter-spacing:.23em;font-weight:800}h1{margin:4px 0 0;font-size:clamp(33px,6vw,50px);letter-spacing:-.045em;line-height:1.2}h2{font-size:19px;margin:0}p{margin:7px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:1.03fr 1fr;gap:20px;margin-top:26px;align-items:start}.card{background:var(--white);border:1px solid var(--line);border-radius:23px;padding:23px;min-width:0}.head,.row,.actions{display:flex;align-items:center;gap:9px}.head{justify-content:space-between;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}.tag{background:var(--soft);color:var(--red);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
input,select,button{border:1px solid var(--line);border-radius:10px;background:var(--white);padding:8px 11px;min-width:0}input,select{width:100%}.row>*{flex:1}.row>button{flex:none}.primary{background:var(--red);color:white;border-color:var(--red);font-weight:700}.ghost{background:transparent}.timer{text-align:center}.timer .head{text-align:left}.ring{margin:24px auto 20px;width:220px;max-width:100%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--red) var(--arc,100%),var(--soft) 0);padding:6px}.face{background:var(--white);width:100%;height:100%;border-radius:50%;display:grid;align-content:center}.time{font-size:52px;font-weight:750;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.06em}.face small{color:var(--muted);margin-top:6px}.timer .actions{justify-content:center;margin:14px 0 20px}.timer .actions button{padding:9px 15px}.settings{border-top:1px solid var(--line);padding-top:13px;text-align:left}label{display:block;font-size:12px;font-weight:700}label input,label select{display:block;margin-top:4px;font-weight:400}.col{display:grid;gap:20px}.total{font-size:38px;line-height:1.3;letter-spacing:-.05em;font-weight:780;margin-top:16px}.date{width:auto}.empty{padding:16px 0 7px;color:var(--muted);font-size:13px}.summary{padding-top:6px}.metric{margin-top:10px}.metric div:first-child,.record{display:flex;justify-content:space-between;align-items:center;gap:10px}.track{margin-top:5px;height:5px;border-radius:99px;background:var(--soft);overflow:hidden}.track span{display:block;height:100%;background:var(--red)}.record{border-top:1px solid var(--line);padding:9px 0;overflow-wrap:anywhere}.record strong{display:block}.record button{padding:3px 7px;font-size:12px}.record:first-child{margin-top:8px}details{border-top:1px solid var(--line);margin-top:16px;padding-top:11px}summary{cursor:pointer;font-weight:650}.form{margin-top:12px;display:grid;gap:10px}.msg{min-height:1.6em;margin-top:10px;color:var(--green);font-size:13px}footer{font-size:12px;color:var(--muted);text-align:center;margin:22px 0 0}
@media(max-width:740px){.grid{grid-template-columns:1fr}main{padding-top:27px}.card{padding:18px}.top,main{width:calc(100% - 28px)}.top{height:60px}}
.group{margin-top:12px;padding-top:10px}.group summary strong{float:right;margin-left:10px}.group summary,.metric span{overflow-wrap:anywhere}.group .metric{padding-left:14px}.settings label{min-width:0}.item-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:end}@media(max-width:410px){.item-fields{grid-template-columns:minmax(0,1fr) auto}.item-fields label:first-child{grid-column:1/-1}}
</style>
<style>
.record-actions,.trend-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.record-actions{justify-content:flex-end;flex-shrink:0}.trend-card{margin-top:20px}.trend-actions select{width:auto}.trend-nav{display:flex;align-items:center;gap:8px;margin-top:12px}.trend-nav button{padding:4px 10px}.trend-nav strong{font-size:13px}.trend-scroll{overflow-x:auto;padding:8px 3px 5px}.trend-plot{display:grid;gap:4px;min-width:var(--plot-width);margin-top:8px}.trend-day{padding:0;border:0;display:grid;grid-template-rows:145px 24px;background:transparent;align-items:end;min-width:0}.trend-day:hover,.trend-day[aria-current=true]{background:#f2ece2}.trend-stack{height:100%;display:flex;flex-direction:column-reverse;align-items:stretch;max-width:44px;width:75%;margin:auto;border-bottom:1px solid var(--line)}.trend-stack span{display:block;flex:none}.trend-day small{align-self:center;white-space:nowrap;font-size:11px}.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0;margin:12px 0 0;list-style:none}.legend li{display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}.swatch{width:10px;height:10px;border-radius:2px;flex:none}dialog{width:min(420px,calc(100% - 28px));border:1px solid var(--line);border-radius:18px;background:var(--white);color:var(--ink);padding:22px}dialog::backdrop{background:#28272066}.edit-buttons{justify-content:flex-end}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><span class="dot" aria-hidden="true">●</span>番茄工位</div><span class="local">记录保存在此浏览器</span></div></header>
<main>
<div class="eyebrow">FOCUS JOURNAL</div>
<h1>把专注的时间记下来</h1>
<p>选一个学习科目或项目，开始计时。每天花了多久，随时可以回看。</p>
<div class="grid">
<section class="card timer" aria-labelledby="timer-title">
<div class="head"><h2 id="timer-title">番茄钟</h2><span class="tag" id="mode">专注</span></div>
<div class="ring" id="ring"><div class="face"><div class="time" id="clock" role="timer">25:00</div><small id="state">准备开始</small></div></div>
<div class="actions"><button class="primary" id="start">开始专注</button><button id="finish" disabled>结束并记录</button><button id="switch" class="ghost">休息 5 分钟</button></div>
<div class="settings row"><label>当前事项<select id="project"></select></label><label style="flex:0 0 108px">专注时长（分钟）<input id="duration" type="number" min="1" max="180" value="25" required></label></div>
<label style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px"><input id="tick-sound" type="checkbox" style="width:auto;margin:0;accent-color:var(--red)">专注滴答声</label>
<div class="msg" id="timer-message" role="status"></div>
</section>
<div class="col">
<section class="card" aria-labelledby="daily-title">
<div class="head"><h2 id="daily-title">每日专注</h2><input class="date" type="date" id="day" aria-label="查看日期"></div>
<div class="total" id="total">0 分钟</div><div class="small" id="count">0 条记录</div>
<div class="summary" id="summary"></div>
<details id="record-details"><summary>查看记录明细</summary><div id="records"></div></details>
<details><summary>手动补记</summary>
<form class="form" id="manual"><label>事项<select id="manual-project"></select></label><div class="row"><label>日期<input type="date" id="manual-date" required></label><label>分钟<input type="number" id="manual-minutes" min="1" max="1440" required placeholder="例如 35"></label></div><button type="submit">保存记录</button></form>
</details>
<div class="msg" id="daily-message" role="status"></div>
</section>
<section class="card"><div class="head"><h2>大类与事项</h2></div><p class="small">在每个大类下添加具体的学习内容或项目。</p>
<form class="form" id="add-category"><div class="row"><input id="category-name" maxlength="36" required placeholder="例如 系统设计" aria-label="大类名称"><button type="submit">新增大类</button></div></form>
<form class="form" id="add"><div class="item-fields"><label>所属大类<select id="category" required></select></label><label>事项名称<input id="name" maxlength="36" required placeholder="例如 Project 2"></label><button type="submit">添加事项</button></div></form>
<div class="msg" id="add-message" role="status"></div>
</section>
</div>
</div>
<section class="card trend-card" aria-labelledby="trend-title">
<div class="head"><h2 id="trend-title">专注趋势</h2><div class="trend-actions"><select id="trend-period" aria-label="统计周期"><option value="week">每周</option><option value="month">每月</option></select><select id="trend-category" aria-label="筛选大类"></select></div></div>
<div class="trend-nav"><button type="button" id="trend-prev" aria-label="上一周期">‹</button><strong id="trend-range"></strong><button type="button" id="trend-next" aria-label="下一周期">›</button><button type="button" id="trend-now">本期</button></div>
<p class="small" id="trend-info"></p>
<div class="trend-scroll"><div id="trend-chart" class="trend-plot" role="group" aria-label="每日用时堆叠柱状图"></div></div>
<ul id="trend-legend" class="legend small" aria-label="各项累计用时"></ul>
</section>
<footer>统计使用设备的本地日期。休息时间不会计入专注时长。</footer>
</main>
<dialog id="edit-dialog" aria-labelledby="edit-title">
<h2 id="edit-title">编辑专注记录</h2>
<form id="edit-form" class="form">
<label>事项<select id="edit-project" required></select></label>
<label>日期<input id="edit-date" type="date" required></label>
<div class="row"><label>分钟<input id="edit-minutes" type="number" min="0" step="1" required></label><label>秒<input id="edit-seconds" type="number" min="0" max="59" step="1" required></label></div>
<div class="msg" id="edit-message" role="status"></div>
<div class="actions edit-buttons"><button type="button" id="edit-cancel">取消</button><button type="submit" class="primary">保存修改</button></div>
</form>
</dialog>
<script>
'use strict';
const $ = id => document.getElementById(id);
const key = 'focus-desk.v1';
const defaults = {projects:[{id:'study',name:'通用学习',kind:'学习'},{id:'project',name:'个人项目',kind:'项目'}],records:[],session:null,selected:'study',minutes:25};
let data = structuredClone(defaults);
try {
  const saved = localStorage.getItem(key);
  if (saved) data = JSON.parse(saved);
} catch {
  $('timer-message').textContent = '无法读取浏览器里的记录。';
}
function restoreCategories() {
  if (data.categories) return;
  data.categories = [
    {id:'ai-infra', name:'AI Infra'},
    {id:'learning', name:'学习'},
    {id:'projects', name:'项目'}
  ];
  for (const project of data.projects) {
    project.category = project.kind === '项目' ? 'projects' : 'learning';
    delete project.kind;
  }
  data.projects.push(
    {id:'ai-infra-foundations', name:'Foundational Knowledge', category:'ai-infra'},
    {id:'ai-infra-project-1', name:'Project 1', category:'ai-infra'}
  );
}
function nameKey(name) {
  return name.normalize('NFKC').trim().replace(/\s+/g, ' ').toLowerCase();
}
function restoreData() {
  restoreCategories();
  const canonical = new Map();
  const duplicates = new Map();
  data.projects = data.projects.filter(project => {
    const key = JSON.stringify([project.category, nameKey(project.name)]);
    const existing = canonical.get(key);
    if (existing) {
      duplicates.set(project.id, existing);
      return false;
    }
    canonical.set(key, project.id);
    return true;
  });
  if (!duplicates.size) return;
  for (const record of data.records) record.project = duplicates.get(record.project) ?? record.project;
  data.selected = duplicates.get(data.selected) ?? data.selected;
  if (data.session) data.session.project = duplicates.get(data.session.project) ?? data.session.project;
}
restoreData();

function save() {
  try {
    localStorage.setItem(key, JSON.stringify(data));
  } catch {
    $('timer-message').textContent = '浏览器存储不可用，关闭页面后本次更改可能丢失。';
  }
}
function dayOf(time = Date.now()) {
  const date = new Date(time);
  return [date.getFullYear(), date.getMonth() + 1, date.getDate()].map(n => String(n).padStart(2, '0')).join('-');
}
function id() {
  return globalThis.crypto?.randomUUID?.() ?? Date.now().toString(36) + Math.random().toString(36).slice(2);
}
function human(ms) {
  const seconds = Math.floor(ms / 1000);
  if (seconds < 60) return seconds + ' 秒';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return minutes + ' 分钟';
  const rest = minutes % 60;
  return Math.floor(minutes / 60) + ' 小时' + (rest ? ' ' + rest + ' 分钟' : '');
}
function fillProjects() {
  for (const picker of [$('project'), $('manual-project'), $('edit-project')]) {
    const selected = picker.id === 'project' ? data.selected : picker.value || data.selected;
    picker.replaceChildren();
    for (const category of data.categories) {
      const projects = data.projects.filter(project => project.category === category.id);
      if (!projects.length) continue;
      const group = document.createElement('optgroup');
      group.label = category.name;
      group.append(...projects.map(project => new Option(project.name, project.id)));
      picker.append(group);
    }
    picker.value = selected;
  }
  const categoryPicker = $('category');
  const selectedCategory = categoryPicker.value || data.categories[0].id;
  categoryPicker.replaceChildren(...data.categories.map(category => new Option(category.name, category.id)));
  categoryPicker.value = selectedCategory;
  const trendPicker = $('trend-category');
  const selectedTrend = trendPicker.value;
  trendPicker.replaceChildren(new Option('所有大类', ''), ...data.categories.map(category => new Option(category.name, category.id)));
  trendPicker.value = selectedTrend;
}
function element(tag, value, className) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  el.textContent = value;
  return el;
}
function renderDaily() {
  renderTrend();
  const records = data.records.filter(r => r.day === $('day').value).sort((a, b) => b.at - a.at);
  const total = records.reduce((sum, r) => sum + r.ms, 0);
  $('total').textContent = total ? human(total) : '0 分钟';
  $('count').textContent = records.length + ' 条记录';
  $('summary').replaceChildren();
  $('records').replaceChildren();
  if (!records.length) {
    $('summary').append(element('div', '这一天还没有专注记录。', 'empty'));
    $('records').append(element('div', '暂无明细', 'empty'));
    return;
  }
  const totals = new Map();
  for (const record of records) totals.set(record.project, (totals.get(record.project) || 0) + record.ms);
  const groups = data.categories.map(category => {
    const items = data.projects
      .filter(project => project.category === category.id && totals.has(project.id))
      .sort((a,b) => totals.get(b.id) - totals.get(a.id));
    const ms = items.reduce((sum, project) => sum + totals.get(project.id), 0);
    return {category, items, ms};
  }).filter(group => group.ms > 0).sort((a,b) => b.ms - a.ms);
  for (const {category, items, ms} of groups) {
    const group = element('details', '', 'group');
    const heading = element('summary', category.name);
    heading.append(element('strong', human(ms)));
    group.append(heading);
    for (const project of items) {
      group.append(projectMetric(project.name, totals.get(project.id), ms));
    }
    $('summary').append(group);
  }
  for (const record of records) {
    const row = element('div', '', 'record');
    const label = element('div', '');
    const project = data.projects.find(p => p.id === record.project);
    const category = data.categories.find(c => c.id === project.category);
    const name = category.name + ' / ' + project.name;
    label.append(element('strong', name), element('span', (record.manual ? '手动补记' : '番茄钟') + ' · ' + human(record.ms), 'small'));
    const remove = element('button', '删除', 'ghost');
    const edit = element('button', '编辑', 'ghost');
    edit.setAttribute('aria-label', '编辑 ' + name + ' 的记录');
    edit.onclick = () => openEdit(record);
    remove.setAttribute('aria-label', '删除 ' + name + ' 的 ' + human(record.ms) + '记录');
    remove.onclick = () => {
      if (!confirm('删除这条专注记录？')) return;
      data.records = data.records.filter(r => r.id !== record.id);
      save();
      renderDaily();
    };
    const actions = element('div', '', 'record-actions');
    actions.append(edit, remove);
    row.append(label, actions);
    $('records').append(row);
  }
}
function projectMetric(name, ms, total) {
  const metric = element('div', '', 'metric');
  const label = element('div', '');
  label.append(element('span', name), element('strong', human(ms)));
  const track = element('div', '', 'track');
  const bar = element('span', '');
  bar.style.width = (100 * ms / total) + '%';
  track.append(bar);
  metric.append(label, track);
  return metric;
}
let editingId;
function openEdit(record) {
  editingId = record.id;
  $('edit-project').value = record.project;
  $('edit-date').value = record.day;
  const seconds = Math.floor(record.ms / 1000);
  $('edit-minutes').value = Math.floor(seconds / 60);
  $('edit-seconds').value = seconds % 60;
  $('edit-message').textContent = '';
  $('edit-dialog').showModal();
}
$('edit-cancel').onclick = () => $('edit-dialog').close();
$('edit-form').onsubmit = event => {
  event.preventDefault();
  const record = data.records.find(record => record.id === editingId);
  if (!record) {
    $('edit-message').textContent = '这条记录已被删除。';
    return;
  }
  const seconds = 60 * Number($('edit-minutes').value) + Number($('edit-seconds').value);
  const existingSeconds = Math.floor(record.ms / 1000);
  if ((seconds < 1 && seconds !== existingSeconds) || seconds > 86400) {
    $('edit-message').textContent = '请输入 1 秒到 24 小时之间的时长。';
    return;
  }
  record.project = $('edit-project').value;
  record.day = $('edit-date').value;
  if (seconds !== existingSeconds) record.ms = seconds * 1000;
  save();
  $('edit-dialog').close();
  $('day').value = record.day;
  $('day').onchange();
  $('daily-message').textContent = '记录已更新。';
};

const chartColors = ['#ab3d2d','#476548','#335f87','#976b22','#87517d','#2e7974','#6a5a48','#a65c76'];
let trendAnchor = dayOf();
function dateFromDay(day) {
  return new Date(day + 'T00:00:00');
}
function offsetDay(date, offset) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + offset);
}
function trendPeriod() {
  const anchor = dateFromDay(trendAnchor);
  if ($('trend-period').value === 'month') {
    const start = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    const end = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 1);
    return {start, end};
  }
  const start = offsetDay(anchor, -(anchor.getDay() + 6) % 7);
  return {start, end:offsetDay(start, 7)};
}
function renderTrend() {
  const {start, end} = trendPeriod();
  const first = dayOf(start);
  const last = dayOf(offsetDay(end, -1));
  $('trend-range').textContent = first + ' 至 ' + last;
  const category = $('trend-category').value;
  const series = category
    ? data.projects.filter(project => project.category === category)
    : data.categories;
  const projects = new Map(data.projects.map(project => [project.id, project]));
  const byDay = new Map();
  const totals = new Map();
  for (const record of data.records) {
    if (record.day < first || record.day > last) continue;
    const project = projects.get(record.project);
    if (!project || (category && project.category !== category)) continue;
    const key = category ? project.id : project.category;
    if (!byDay.has(record.day)) byDay.set(record.day, {total:0, items:new Map()});
    const entry = byDay.get(record.day);
    entry.total += record.ms;
    entry.items.set(key, (entry.items.get(key) || 0) + record.ms);
    totals.set(key, (totals.get(key) || 0) + record.ms);
  }
  const chart = $('trend-chart');
  const legend = $('trend-legend');
  chart.replaceChildren();
  legend.replaceChildren();
  const total = [...totals.values()].reduce((sum, ms) => sum + ms, 0);
  $('trend-info').textContent = total ? '合计 ' + human(total) + ' · 点柱子查看当天记录' : '这个周期还没有专注记录。';
  if (!total) return;
  const peak = Math.max(...[...byDay.values()].map(entry => entry.total));
  const shown = series.map((item, index) => ({...item, color:chartColors[index % chartColors.length]}))
    .filter(item => totals.has(item.id));
  for (const item of shown) {
    const row = element('li', '');
    const swatch = element('span', '', 'swatch');
    swatch.style.backgroundColor = item.color;
    row.append(swatch, element('span', item.name + ' · ' + human(totals.get(item.id))));
    legend.append(row);
  }
  let count = 0;
  for (let date = start; date < end; date = offsetDay(date, 1)) {
    const day = dayOf(date);
    const entry = byDay.get(day);
    const button = element('button', '', 'trend-day');
    button.type = 'button';
    const parts = [];
    const stack = element('span', '', 'trend-stack');
    stack.setAttribute('aria-hidden', 'true');
    for (const item of shown) {
      const ms = entry?.items.get(item.id);
      if (!ms) continue;
      const segment = element('span', '');
      segment.style.height = (ms / peak * 100) + '%';
      segment.style.backgroundColor = item.color;
      stack.append(segment);
      parts.push(item.name + ' ' + human(ms));
    }
    const label = day + ' · ' + (entry ? human(entry.total) + '（' + parts.join('，') + '）' : '0 分钟');
    button.title = label;
    button.setAttribute('aria-label', label);
    button.setAttribute('aria-current', String(day === $('day').value));
    button.onclick = () => {
      $('day').value = day;
      $('day').onchange();
      $('record-details').open = true;
    };
    button.append(stack, element('small', $('trend-period').value === 'month' ? String(date.getDate()) : day.slice(5)));
    chart.append(button);
    count++;
  }
  chart.style.gridTemplateColumns = 'repeat(' + count + ', minmax(0, 1fr))';
  chart.style.setProperty('--plot-width', count * (count > 7 ? 20 : 39) + 'px');
}
$('trend-period').onchange = renderTrend;
$('trend-category').onchange = renderTrend;
$('trend-prev').onclick = () => {
  trendAnchor = dayOf(offsetDay(trendPeriod().start, -1));
  renderTrend();
};
$('trend-next').onclick = () => {
  trendAnchor = dayOf(trendPeriod().end);
  renderTrend();
};
$('trend-now').onclick = () => {
  trendAnchor = dayOf();
  renderTrend();
};
let mode = data.session?.mode || 'focus';
let audioContext;
let tickBuffer;
let tickSource;
let soundingStart;

function syncTickSound() {
  const session = data.session;
  const shouldTick = data.tickSound !== false && session?.mode === 'focus' && session.start !== null;
  const remaining = shouldTick ? session.target - elapsed(session) : 0;
  if (tickSource && (remaining <= 0 || soundingStart !== session?.start)) {
    tickSource.stop();
    tickSource = null;
  }
  if (tickSource || remaining <= 0 || audioContext?.state !== 'running') return;

  const source = audioContext.createBufferSource();
  source.buffer = tickBuffer;
  source.loop = true;
  source.connect(audioContext.destination);
  const start = audioContext.currentTime;
  source.start(start);
  source.stop(start + remaining / 1000);
  tickSource = source;
  soundingStart = session.start;
}

async function enableAudio() {
  if (data.tickSound === false) return;
  try {
    if (!audioContext) {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      audioContext = new Audio();
      const rate = audioContext.sampleRate;
      tickBuffer = audioContext.createBuffer(1, rate, rate);
      const samples = tickBuffer.getChannelData(0);
      // A short, damped click followed by silence forms a one-second loop.
      const clickLength = Math.floor(rate * 0.035);
      for (let i = 0; i < clickLength; i++) {
        const time = i / rate;
        const envelope = Math.min(1, time * 1500) * Math.exp(-time * 165);
        samples[i] = 0.13 * envelope * (0.6 * Math.sin(2 * Math.PI * 1650 * time)
          + 0.4 * (2 * Math.random() - 1));
      }
    }
    await audioContext.resume();
    syncTickSound();
  } catch {
    $('timer-message').textContent = '当前浏览器无法播放滴答声，计时仍会继续。';
  }
}

function elapsed(session, now = Date.now()) {
  const previous = session.spans.reduce((sum, span) => sum + span[1] - span[0], 0);
  return Math.min(session.target, previous + (session.start === null ? 0 : Math.max(0, now - session.start)));
}
function closeSpan(session) {
  if (session.start === null) return;
  const previous = elapsed({...session, start:null});
  const end = Math.max(session.start, Math.min(Date.now(), session.start + session.target - previous));
  if (end > session.start) session.spans.push([session.start, end]);
  session.start = null;
}
function recordSession(session) {
  const days = new Map();
  for (const [start,end] of session.spans) {
    let cursor = start;
    while (cursor < end) {
      const date = new Date(cursor);
      const midnight = new Date(date.getFullYear(), date.getMonth(), date.getDate() + 1).getTime();
      const stop = Math.min(end, midnight);
      const day = dayOf(cursor);
      const entry = days.get(day) || {ms:0, at:cursor};
      entry.ms += stop - cursor;
      days.set(day, entry);
      cursor = stop;
    }
  }
  for (const [day, entry] of days) {
    data.records.push({id:id(), project:session.project, day, ...entry});
  }
}
function finish(completed) {
  const session = data.session;
  closeSpan(session);
  const ms = elapsed(session);
  data.session = null;
  if (session.mode === 'focus' && ms >= 1000) {
    recordSession(session);
    $('timer-message').textContent = (completed ? '番茄完成，已记录 ' : '已记录 ') + human(ms) + '。';
  } else {
    $('timer-message').textContent = session.mode === 'break' ? (completed ? '休息结束。' : '已结束休息。') : '专注不足 1 秒。';
  }
  if (completed) mode = session.mode === 'focus' ? 'break' : 'focus';
  save();
  renderDaily();
  renderTimer();
}
function renderTimer() {
  const session = data.session;
  const target = session?.target ?? (mode === 'break' ? 5 : data.minutes) * 60000;
  const remaining = target - (session ? elapsed(session) : 0);
  if (session && remaining <= 0) {
    finish(true);
    return;
  }
  const seconds = Math.ceil(remaining / 1000);
  $('clock').textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
  $('ring').style.setProperty('--arc', (100 * remaining / target) + '%');
  const resting = mode === 'break';
  const running = session && session.start !== null;
  $('mode').textContent = resting ? '休息' : '专注';
  $('state').textContent = running ? (resting ? '休息中' : '专注中') : session ? '已暂停' : '准备开始';
  $('start').textContent = running ? '暂停' : session ? '继续' : resting ? '开始休息' : '开始专注';
  $('finish').textContent = resting ? '结束休息' : '结束并记录';
  $('switch').textContent = resting ? '切回专注' : '休息 5 分钟';
  $('finish').disabled = !session;
  $('switch').disabled = Boolean(session);
  $('duration').disabled = Boolean(session) || resting;
  $('project').disabled = Boolean(session);
  syncTickSound();
  document.title = session ? $('clock').textContent + ' · 番茄工位' : '番茄工位 · 专注计时与每日记录';
}
$('start').onclick = () => {
  if (data.session && elapsed(data.session) >= data.session.target) return finish(true);
  $('timer-message').textContent = '';
  if (!data.session) {
    if (mode === 'focus' && !$('duration').reportValidity()) return;
    data.session = {mode, project:data.selected, target:(mode === 'break' ? 5 : data.minutes)*60000, start:Date.now(), spans:[]};
  } else if (data.session.start === null) {
    data.session.start = Date.now();
  } else {
    closeSpan(data.session);
  }
  save();
  renderTimer();
  if (data.session?.mode === 'focus' && data.session.start !== null) void enableAudio();
};
$('tick-sound').onchange = () => {
  data.tickSound = $('tick-sound').checked;
  save();
  syncTickSound();
  if (data.tickSound && data.session?.mode === 'focus' && data.session.start !== null) void enableAudio();
};
$('finish').onclick = () => finish(elapsed(data.session) >= data.session.target);
$('switch').onclick = () => {
  mode = mode === 'focus' ? 'break' : 'focus';
  $('timer-message').textContent = '';
  renderTimer();
};
$('duration').oninput = () => {
  if (!$('duration').validity.valid) return;
  data.minutes = $('duration').valueAsNumber;
  save();
  renderTimer();
};
$('project').onchange = () => {
  data.selected = $('project').value;
  save();
};
$('day').onchange = () => {
  if (!$('day').value) $('day').value = dayOf();
  trendAnchor = $('day').value;
  $('manual-date').value = $('day').value;
  $('daily-message').textContent = '';
  renderDaily();
};
$('manual').onsubmit = event => {
  event.preventDefault();
  const day = $('manual-date').value;
  data.records.push({id:id(), project:$('manual-project').value, day, ms:$('manual-minutes').valueAsNumber*60000, at:Date.now(), manual:true});
  $('day').value = day;
  trendAnchor = day;
  $('manual-minutes').value = '';
  $('daily-message').textContent = '补记已保存。';
  save();
  renderDaily();
};
$('add-category').onsubmit = event => {
  event.preventDefault();
  const name = $('category-name').value.trim();
  if (!name || data.categories.some(category => category.name.toLowerCase() === name.toLowerCase())) {
    $('add-message').textContent = name ? '这个大类已经存在。' : '请输入大类名称。';
    return;
  }
  const category = {id:id(), name};
  data.categories.push(category);
  fillProjects();
  $('category').value = category.id;
  $('category-name').value = '';
  $('name').focus();
  $('add-message').textContent = '已新增「' + name + '」，现在可以添加事项。';
  save();
};
$('add').onsubmit = event => {
  event.preventDefault();
  const name = $('name').value.trim();
  const category = $('category').value;
  if (!name) {
    $('add-message').textContent = '请输入事项名称。';
    return;
  }
  if (data.projects.some(p => nameKey(p.name) === nameKey(name) && p.category === category)) {
    $('add-message').textContent = '这个大类下已有同名事项。';
    return;
  }
  const project = {id:id(), name, category};
  data.projects.push(project);
  if (!data.session) data.selected = project.id;
  fillProjects();
  $('name').value = '';
  $('add-message').textContent = '已添加「' + name + '」。';
  save();
};
window.addEventListener('storage', event => {
  if (event.key !== key || !event.newValue) return;
  data = JSON.parse(event.newValue);
  restoreData();
  $('tick-sound').checked = data.tickSound !== false;
  mode = data.session?.mode || 'focus';
  $('duration').value = data.minutes;
  fillProjects();
  renderDaily();
  renderTimer();
});
let today = dayOf();
$('day').value = $('manual-date').value = today;
$('duration').value = data.minutes;
$('tick-sound').checked = data.tickSound !== false;
fillProjects();
renderDaily();
renderTimer();
if (data.session?.mode === 'focus' && data.session.start !== null) {
  document.addEventListener('click', () => {
    if (data.session?.mode === 'focus' && data.session.start !== null) void enableAudio();
  }, {once:true});
}
function tick() {
  const current = dayOf();
  if (today !== current && $('day').value === today) {
    $('day').value = current;
    $('day').onchange();
  }
  today = current;
  renderTimer();
}
setInterval(tick, 250);
document.addEventListener('visibilitychange', tick);
</script>
